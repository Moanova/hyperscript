# Hyperscript ::: Menu général de l'application
# Version : 1.0
# Date : 2026-11-09
# Contenu : spécification initiale. Pas de références aux règles de gestion. Les entrées grisées en MVP sont signalées dans les notes. Les raccourcis clavier sont conservés.

menu:
  name: Menu général
  items:
    - name: Fichiers
      items:
        - name: Nouveau projet...
          shortcut: "Ctrl+N"
          references: "FN005, SU001"
        - name: Ouvrir...
          shortcut: "Ctrl+O"
          references: "FN006, SU001"
        - name: Fermer
          shortcut: "Ctrl+W"
          references: "FN010, SU001"
        - name: Enregistrer
          shortcut: "Ctrl+S"
          references: "FN008, SU001"
        - name: Enregistrer sous...
          shortcut: "Ctrl+Shift+S"
          references: "FN009, SU001"
        - type: separator
        - name: Exporter le projet...
          references: "FN013, SU007"
          note: "Active séance 12 (TSK42) : exporte le projet en document HTML autonome (dossier nommé d'après le projet : index.html + une page par parcours + agents.html + style.css) ; « Exporter la carte... » et « Importer une carte... » restent grisées (post-MVP)"
        - name: Exporter la carte...
          references: "FN013, SU007"
          note: "Reste grisée jusqu'à nouvel ordre (TSK42 séance 12) - l'export de lecture se fait via « Exporter le projet... » ; l'échange de carte entre projets (JSON) est post-MVP"
        - name: Importer une carte...
          references: "SU002"
          note: "Reste grisée jusqu'à nouvel ordre (TSK42 séance 12) - post-MVP (échange de carte entre projets)"
        - type: separator
        - name: Projets récents
          dynamic: true
          description: "Liste dynamique des derniers projets ouverts"
          references: "FN007, SU001"
          note: "Grisée en MVP"
        - type: separator
        - name: Quitter
          shortcut: "Ctrl+Q"
          references: "FN002, SU001"

    - name: Édition
      items:
        - name: Annuler
          shortcut: "Ctrl+Z"
          note: "Grisé en MVP"
        - name: Rétablir
          shortcut: "Ctrl+Y"
          note: "Grisé en MVP"
        - type: separator
        - name: Couper
          shortcut: "Ctrl+X"
          note: "Grisé en MVP"
        - name: Copier
          shortcut: "Ctrl+C"
          note: "Grisé en MVP"
        - name: Coller
          shortcut: "Ctrl+V"
          note: "Grisé en MVP"
      note: "Toutes les entrées sont grisées en MVP."

    - name: Affichage
      items:
        - name: Parcours
          dynamic: true
          description: "Liste cochable : une entrée « Tous les parcours » en tête (cochée = filtre désactivé, état par défaut à l'ouverture d'un projet) plus une entrée par parcours de la carte ; cocher un parcours l'active et active le filtre de parcours"
          references: "FN026, FN029, SU006"
          note: "Le filtre s'applique aux vues portant sur la carte narrative (Parcours, Relations, aperçu Preview), pas à la vue « Agents » ; non persisté entre les sessions"
        - name: Agent
          dynamic: true
          description: "Liste cochable : une entrée « All agents » en tête (cochée = filtre désactivé, état par défaut à l'ouverture d'un projet) plus une entrée par agent du projet ; cocher un agent active le filtre agent"
          references: "FN039, SU006, SU008"
          note: "S'applique aux vues de la carte, pas à la vue « Agents » ; combiné au filtre de parcours, l'intersection s'applique (RG064) ; non persisté entre les sessions"
        - name: Zoom
          items:
            - name: Avant
              shortcut: "Ctrl+="
              note: "Grisé en MVP"
            - name: Arrière
              shortcut: "Ctrl+-"
              note: "Grisé en MVP"
            - name: Réinitialiser
              shortcut: "Ctrl+0"
              note: "Grisé en MVP"

    - name: Projet
      items:
        - name: Vue
          items:
            - name: Agents
              note: "Active séance 12 (TSK39 1.1) : bascule vers la vue (onglet + page) ; ordre d'affichage inversé séance 09 (TSK28 : Agents avant Parcours dans la barre d'onglets)"
            - name: Parcours
              note: "Active séance 12 (TSK39 1.1) : bascule vers la vue ; vue principale (inchangé, TSK28)"
            - name: Relations
              note: "Active séance 12 (TSK39 1.1) : bascule vers la vue (FN036, SU012)"
            - name: Preview
              note: "Active séance 12 (TSK39 1.1) : bascule vers la vue ; fait partie du MVP minimal (TSK37 séance 11 : renommée depuis « Export »)"
        - name: Agents
          items:
            - name: Nouveau...
              references: "FN031, SU008"
            - name: Éditer...
              references: "FN031, SU008"
            - name: Copier
              references: "FN031, SU008"
              note: "« Copier » est le terme retenu pour la duplication sur tous les sous-menus"
            - name: Supprimer...
              references: "FN031, SU008"
            - name: Ajouter une participation...
              references: "FN030, SU008"
              note: "Crée/modifie les participations (agent présent dans un bloc). Libellé normalisé « Add Participation » séance 12 (TSK39 1.3) : même libellé pour cette entrée et pour l'entrée équivalente du menu contextuel du bloc dans la vue « Journeys » ; grisée hors vue « Journeys » active + bloc sélectionné (TSK39 1.3)"
        - name: Blocs
          items:
            - name: Nouveau
              items:
                - name: Scène
                - name: Pivot
                - name: Condition
                - name: Fin
              references: "FN014, SU003"
              note: "Début est volontairement absent de ce sous-menu : il est créé automatiquement avec la carte, unique, et non duplicable (règle de gestion à venir)"
            - name: Éditer...
              references: "FN015, SU003"
            - name: Copier
              references: "FN016, SU003"
            - name: Supprimer...
              references: "FN018, SU003"
        - name: Transitions
          items:
            - name: Nouvelle
              references: "FN020, SU004"
            - name: Éditer...
              references: "FN021, SU004"
            - name: Supprimer...
              references: "FN022, SU004"
        - name: Parcours
          items:
            - name: Nouveau
              references: "FN023, SU005"
              note: "Ouvre un dialogue d'édition (libellé, note) séance 12 (TSK39 1.8) ; « Copier » (FN025) supprimé séance 12 (TSK39 1.9)"
            - name: Éditer...
              references: "FN024, SU005"
            - name: Définir par défaut...
              references: "FN038, SU005"
            - name: Supprimer...
              references: "FN027, SU005"
        - name: Relations
          items:
            - name: Nouvelle...
              references: "FN034, SU011"
            - name: Éditer...
              references: "FN034, SU011"
            - name: Supprimer...
              references: "FN034, SU011"

    - name: À propos
      items:
        - name: Historique des changements
          references: "FN003"
        - name: À propos d'Hyperscript
          references: "FN004"

  context_menu:
    description: "Le menu contextuel doit rester aligné dynamiquement sur le menu applicatif (mêmes actions et gestionnaires), selon la vue active et les objets graphiques sélectionnés. Sur la grille vide de la vue « Parcours », les entrées de création portent des libellés propres au menu contextuel : « New Block » (sous-menu Scène / Pivot / Condition / Fin, comme Projet > Blocs > Nouveau) et « New Transition » (comme Projet > Transitions > Nouvelle) — acté séance 04 (TSK16) ; dans la vue « Relationships », le menu contextuel d'une cellule de la matrice reprend `Project › Relationships` (New.../Edit.../Delete...) et ajoute « View in Journeys view » (FN032 : bascule effective vers « Journeys » avec le focus sur le bloc d'ancrage de la relation ; grisée sur une case vide — TSK39 séance 12, 2.1/2.2) — acté séance 06 (TSK27)."

  legend:
    description: |
      Les éléments marqués 'dynamic: true' sont générés dynamiquement depuis les données de l'application.
      Les entrées grisées en MVP sont signalées dans les notes.
      Les espaces de travail (vues) sont référencés par leur nom, sans numérotation : Parcours, Agents, Relations, Preview.
      Règle des points de suspension : toute entrée ouvrant une fenêtre nécessitant une action complémentaire de l'utilisateur (dialogue de saisie, de choix ou de confirmation) est suffixée de « ... » ; une fenêtre purement informative (ex. « À propos d'Hyperscript ») n'en porte pas. Exception : « Nouveau projet... » conserve « ... » par convention usuelle (création directe en mémoire ; seule une confirmation de sauvegarde conditionnelle peut s'afficher).
