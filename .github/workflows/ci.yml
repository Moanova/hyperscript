name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install system libraries for Qt (offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Create virtual environment and install locked dependencies
        run: |
          uv venv
          uv sync --no-install-project --locked

      - name: Syntax check
        run: .venv/bin/python -m compileall -q src

      - name: Lint
        run: .venv/bin/python -m pyflakes src

      - name: Tests (offscreen)
        run: QT_QPA_PLATFORM=offscreen .venv/bin/python -m pytest tests/ -q
