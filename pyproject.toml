[project]
name = "hyperscript"
version = "1.0.0"
description = "Visual narrative map editor"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Thomas Soucheleau"}
]

dependencies = [
    "PySide6>=6.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pywinauto>=0.6.8",
    "pytest-xvfb",
    "Pillow>=9.0.0",
]
